# Render settings for the film pipeline and the profiles used to test waiting times.
#
# Every `est_seconds*` value is a rough guess for an L40. Run the benchmark
# (`python -m benchmark.run_benchmark`) and pass its results file to the planner
# to replace them with measured numbers.

film:
  acts: 6
  # Each shot (one image prompt, one video clip) lasts shot_seconds. The viewer
  # picks how many shots the film has; they are split across the six beats.
  shots: 36
  min_shots: 6
  max_shots: 72
  shot_seconds: 5
  # How long a viewer is expected to spend on each choice. Act N's shots can
  # start rendering once act N is locked, so this sets how much GPU time is
  # available during play.
  seconds_per_choice: 90
  # Every shot is resized and cropped to this size and fps before stitching.
  width: 768
  height: 512
  fps: 24

# Render server (bvg.server). Both the keyframe and the video model are kept
# loaded, but FLUX.1-schnell (32 GB peak) and LTX-Video (38.5 GB) don't fit on the
# GPU together. swap_models keeps them in host RAM and moves the one a job needs
# onto the GPU, so weights only move when the job type changes. offload_all
# (used when swap_models is off) offloads per call instead: on the L40 that made
# keyframes 23 s instead of 1.3 s and LTX shots 50-80 s instead of 20 s.
server:
  swap_models: true
  offload_all: true
  idle_lease_minutes: 15
  outputs: outputs/sessions

# When true, selecting a model whose catalog entry is not `permissive` is an error.
model_policy:
  permissive_only: false

# Which catalog model each stage uses. Override on the command line with
# `--model standard=wan2.2-ti2v-5b`. Any key next to `model` overrides the
# catalog defaults for that stage.
keyframe:
  model: flux1-schnell
  width: 768
  height: 512
  # Measured on the L40: 1.32 s per 832x480 image at 4 steps, 32.3 GB peak VRAM.
  est_seconds_per_image: 1.3

render_types:
  # A slow camera move over the keyframe. Almost free, used to fit tight budgets.
  pan:
    backend: pan
    width: 768
    height: 512
    fps: 24
    zoom: 1.15
    est_seconds_per_shot: 2

  # Fast image-to-video model, used for most shots.
  standard:
    model: ltx-0.9.7-distilled
    # Measured on the L40: 20.0 s per 121-frame shot, 38.5 GB peak VRAM.
    est_seconds_per_shot: 20

  # Higher quality image-to-video model, used for the most important shots.
  # 40 steps without a distillation LoRA is slow (minutes per shot). To try a
  # 4-step distillation LoRA, set `lora` and `steps: 4`, `guidance: 1.0` here.
  hero:
    model: wan2.2-i2v-a14b
    cpu_offload: true
    # Measured on the L40: 1455 s per 81-frame shot at 40 steps with offload,
    # 30.5 GB peak VRAM, about 70 GB host RAM. Too slow for any hero shot in
    # `balanced`; needs a 4-step distillation LoRA to be useful.
    est_seconds_per_shot: 1455

# Who writes the story: each act's scene, question and choices, then its shot
# prompts and narration, from the viewer's answers. Any OpenAI-compatible chat
# endpoint works: Ollama (http://127.0.0.1:11434/v1), vLLM, llama.cpp server, or a
# hosted API (key in the env var named by api_key_env). If a call fails, the simple
# writer (plain placeholder text, no model) fills in so the film still finishes.
# `model` is an llm entry of the catalog below; the app lets the viewer pick another.
story:
  writer: llm                 # llm or simple
  base_url: http://127.0.0.1:11434/v1
  model: qwen3-8b-abliterated
  api_key_env: BVG_LLM_API_KEY
  language: English
  temperature: 0.9
  max_tokens: 2500
  timeout_seconds: 120
  fallback_to_simple: true
  extra_body: {}              # extra request fields, e.g. {"think": false} or {"options": {"num_gpu": 0}} for Ollama

# Keyframes for shots with the protagonist when the viewer uploads a photo: an
# image-edit model redraws the scene with that person in it.
photo:
  model: flux1-kontext-dev

# Audio mixed into the film: a narration voice per shot and a music bed.
audio:
  narration: kokoro          # kokoro (small TTS, runs on the CPU) or none
  voice: af_heart            # default voice; the app lets the viewer pick
  music_dir: assets/music    # mp3/wav files to use as music; a soft synthesized pad when empty
  music_volume: 0.25         # relative to narration, lowered further while someone speaks

finish:
  # Stitching, music and narration mix, optional upscale and interpolation.
  est_seconds: 60

# target_wait_minutes: time from the viewer's last choice to a finished film.
# max_hero_shots caps how many shots may use the hero model.
profiles:
  fast:
    target_wait_minutes: 3
    max_hero_shots: 0
  balanced:
    target_wait_minutes: 20
    max_hero_shots: 8
  quality:
    target_wait_minutes: 60
    max_hero_shots: 36

# Model catalog. `kind` is t2i (keyframes), i2v (shots) or edit (keyframes that
# put the viewer's photo into the scene). `est_seconds` is per image or per 5 s
# shot on the L40; it is used for planning when a model is picked per film. `permissive` means the
# license allows commercial use with no field-of-use, revenue or territory limits.
# License notes are a summary; check the model card before shipping.
models:
  # --- story writers (LLM) ---
  # model_id is the name on the LLM server (here Ollama: `ollama pull <model_id>`).
  # vram_gb is the Q4 download size, about what the model takes in GPU memory.
  # The video models peak at 32-38 GB, so on the 48 GB L40 only the small writers
  # fit on the GPU next to them; the larger ones need GPU room or run on the CPU.
  # Abliterated models have the refusal direction removed from their weights, so
  # they write what the story asks for instead of refusing (marked uncensored).
  qwen3-8b-abliterated:
    kind: llm
    license: Apache-2.0
    permissive: true
    uncensored: true
    model_id: huihui_ai/qwen3-abliterated:8b
    vram_gb: 5
    prompt_suffix: " /no_think"
    note: fits on the GPU next to the video models

  gemma4-12b-abliterated:
    kind: llm
    license: Gemma
    permissive: false
    uncensored: true
    model_id: huihui_ai/gemma-4-abliterated:12b
    vram_gb: 9  # estimate, size not listed
    note: better prose, tight next to the video models

  qwen3.6-35b-a3b-abliterated:
    kind: llm
    license: Apache-2.0
    permissive: true
    uncensored: true
    model_id: huihui_ai/Qwen3.6-abliterated:35b
    vram_gb: 22
    note: mixture of experts (3B active), fast enough on the CPU

  gemma4-26b-a4b-abliterated:
    kind: llm
    license: Gemma
    permissive: false
    uncensored: true
    model_id: huihui_ai/gemma-4-abliterated:26b
    vram_gb: 18
    note: mixture of experts (4B active), fast enough on the CPU

  qwen3.8-27b-abliterated:
    kind: llm
    license: Apache-2.0
    permissive: true
    uncensored: true
    model_id: huihui_ai/Qwen3.8-abliterated:27b
    vram_gb: 18
    note: the strongest writer here; dense, so it needs GPU room

  qwen3-8b:
    kind: llm
    license: Apache-2.0
    permissive: true
    model_id: qwen3:8b
    vram_gb: 5
    prompt_suffix: " /no_think"
    note: the stock model, for comparison

  # --- keyframes (text to image) ---
  flux1-schnell:
    est_seconds: 1.3  # measured
    kind: t2i
    license: Apache-2.0
    permissive: true
    pipeline: FluxPipeline
    model_id: black-forest-labs/FLUX.1-schnell
    dtype: bfloat16
    width: 832
    height: 480
    steps: 4
    guidance: 0.0
    extra_kwargs:
      max_sequence_length: 256

  qwen-image:
    est_seconds: 25  # guess
    kind: t2i
    license: Apache-2.0
    permissive: true
    pipeline: QwenImagePipeline
    model_id: Qwen/Qwen-Image
    dtype: bfloat16
    width: 832
    height: 480
    steps: 30
    guidance: 4.0
    guidance_arg: true_cfg_scale
    extra_kwargs:
      negative_prompt: " "

  # Qwen-Image with an abliterated copy of its text encoder (Qwen2.5-VL 7B), so
  # prompts are not softened before they reach the image model.
  qwen-image-abliterated:
    est_seconds: 25  # guess
    kind: t2i
    license: Apache-2.0
    permissive: true
    uncensored: true
    pipeline: QwenImagePipeline
    model_id: Qwen/Qwen-Image
    text_encoder:
      class: Qwen2_5_VLForConditionalGeneration
      model_id: huihui-ai/Qwen2.5-VL-7B-Instruct-abliterated
    dtype: bfloat16
    width: 832
    height: 480
    steps: 30
    guidance: 4.0
    guidance_arg: true_cfg_scale
    extra_kwargs:
      negative_prompt: " "

  flux1-dev:
    est_seconds: 10  # guess
    kind: t2i
    license: FLUX.1 [dev] Non-Commercial
    permissive: false
    pipeline: FluxPipeline
    model_id: black-forest-labs/FLUX.1-dev
    dtype: bfloat16
    width: 832
    height: 480
    steps: 28
    guidance: 3.5

  # --- shots (image to video) ---
  wan2.2-i2v-a14b:
    est_seconds: 1455  # measured, 40 steps with offload
    kind: i2v
    license: Apache-2.0
    permissive: true
    pipeline: WanImageToVideoPipeline
    call_style: image
    model_id: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    dtype: bfloat16
    width: 832
    height: 480
    fps: 16
    frame_multiple: 4
    steps: 40
    guidance: 3.5

  # Measured on the L40 with cpu_offload on: 645 s per shot, 15.9 GB peak VRAM.
  # It fits in VRAM, so try cpu_offload: false, 832x480 or fewer steps for speed.
  wan2.2-ti2v-5b:
    est_seconds: 645  # measured, 50 steps with offload
    kind: i2v
    license: Apache-2.0
    permissive: true
    pipeline: WanImageToVideoPipeline
    call_style: image
    model_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    dtype: bfloat16
    width: 1280
    height: 704
    fps: 24
    frame_multiple: 4
    steps: 50
    guidance: 5.0
    vae_tiling: true

  wan2.1-i2v-14b-480p:
    est_seconds: 900  # guess
    kind: i2v
    license: Apache-2.0
    permissive: true
    pipeline: WanImageToVideoPipeline
    call_style: image
    model_id: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
    dtype: bfloat16
    width: 832
    height: 480
    fps: 16
    frame_multiple: 4
    steps: 40
    guidance: 5.0

  ltx-0.9.7-distilled:
    est_seconds: 20  # measured
    kind: i2v
    license: LTX-Video Open Weights (paid license above a revenue threshold)
    permissive: false
    pipeline: LTXConditionPipeline
    call_style: ltx_condition
    model_id: Lightricks/LTX-Video-0.9.7-distilled
    dtype: bfloat16
    width: 768
    height: 512
    fps: 24
    frame_multiple: 8
    steps: 8
    guidance: 1.0
    extra_kwargs:
      decode_timestep: 0.05
      image_cond_noise_scale: 0.025
    vae_tiling: true

  hunyuanvideo-i2v:
    est_seconds: 600  # guess
    kind: i2v
    license: Tencent Hunyuan Community (excludes EU, UK, South Korea)
    permissive: false
    pipeline: HunyuanVideoImageToVideoPipeline
    call_style: image
    model_id: hunyuanvideo-community/HunyuanVideo-I2V
    dtype: bfloat16
    width: 848
    height: 480
    fps: 24
    frame_multiple: 4
    steps: 30
    guidance: 1.0
    vae_tiling: true
    cpu_offload: true

  # --- keyframes from the viewer's photo (image edit) ---
  flux1-kontext-dev:
    est_seconds: 10  # guess
    kind: edit
    license: FLUX.1 [dev] Non-Commercial
    permissive: false
    pipeline: FluxKontextPipeline
    model_id: black-forest-labs/FLUX.1-Kontext-dev
    dtype: bfloat16
    width: 768
    height: 512
    steps: 28
    guidance: 2.5

  qwen-image-edit-2509:
    est_seconds: 60  # guess
    kind: edit
    license: Apache-2.0
    permissive: true
    pipeline: QwenImageEditPlusPipeline
    model_id: Qwen/Qwen-Image-Edit-2509
    dtype: bfloat16
    width: 768
    height: 512
    steps: 40
    guidance: 4.0
    guidance_arg: true_cfg_scale
    extra_kwargs:
      negative_prompt: " "

  # The same edit model with the abliterated text encoder.
  qwen-image-edit-2509-abliterated:
    est_seconds: 60  # guess
    kind: edit
    license: Apache-2.0
    permissive: true
    uncensored: true
    pipeline: QwenImageEditPlusPipeline
    model_id: Qwen/Qwen-Image-Edit-2509
    text_encoder:
      class: Qwen2_5_VLForConditionalGeneration
      model_id: huihui-ai/Qwen2.5-VL-7B-Instruct-abliterated
    dtype: bfloat16
    width: 768
    height: 512
    steps: 40
    guidance: 4.0
    guidance_arg: true_cfg_scale
    extra_kwargs:
      negative_prompt: " "
