[project]
name = "bvg"
version = "0.1.0"
description = "Branching story to personalized AI film, rendered on one GPU"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
# GPU stack for the benchmark and the render server. Install torch for your CUDA version first.
gpu = [
    "torch",
    "diffusers>=0.35",
    "transformers",
    "accelerate",
    "sentencepiece",
    "tiktoken",
    "imageio-ffmpeg",
    "peft",
    "ftfy",
]
server = ["fastapi", "uvicorn"]
# Narration voice (Kokoro TTS, runs on the CPU). espeak-ng from the OS package manager improves rare words.
audio = ["kokoro>=0.9"]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["bvg", "bvg.renderers", "benchmark"]

[tool.setuptools.package-data]
bvg = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
